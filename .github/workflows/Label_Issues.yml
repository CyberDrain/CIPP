---
name: Label Issues
on:
  issues:
    types:
      - opened
jobs:
  label_issues_bugs:
    if: github.repository_owner == 'CyberDrain' && contains(github.event.issue.title, 'Bug')
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Label Issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number }
            await github.rest.issues.addLabels({ ...issue, labels: ['bug'] })
            await github.rest.issues.update({ ...issue, type: 'Bug' })
  label_issues_frs:
    if: github.repository_owner == 'CyberDrain' && contains(github.event.issue.title, 'Feature')
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Label Issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number }
            await github.rest.issues.addLabels({ ...issue, labels: ['Feature', 'no-priority'] })
            await github.rest.issues.update({ ...issue, type: 'Feature' })
