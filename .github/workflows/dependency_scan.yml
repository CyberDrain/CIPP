---
name: Dependency Vulnerability Scan
on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  yarn-audit:
    if: github.repository_owner == 'CyberDrain'
    name: yarn audit
    runs-on: ubuntu-latest
    # Checkout and audit only; nothing is written back to the repo.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Node version comes from frontend/package.json `engines.node` so CI can
      # never drift from what the app declares it supports.
      - name: Use Node.js from package.json engines
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Audit for high/critical vulnerabilities
        # --level only filters the report; the exit code is a bitmask of every severity
        # found (8 = high, 16 = critical), so check it here.
        run: |
          set +e
          yarn audit --level high
          code=$?
          if [ "$code" -ge 8 ]; then exit "$code"; fi
          exit 0
