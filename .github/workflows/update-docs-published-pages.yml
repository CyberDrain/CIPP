name: Update Docs Published Pages

# Refreshes backend/Config/DocsPublishedPages.txt (the list of pages live on docs.cipp.app that the
# SearchDocs / GetDoc MCP tools link to) from docs.cipp.app/llms.txt with
# build/tools/Update-DocsPublishedPages.ps1, and opens a PR against dev when it changed. The container
# build refreshes its own copy, but the committed file is the fallback and is what
# Tests/Mcp/CippDocs.Tests.ps1 checks the slug derivation against, so a stale one fails Pester as
# soon as a page moves. Requires "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.

on:
  schedule:
    - cron: '0 4 * * *' # Daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-docs-published-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'CyberDrain/CIPP'
    name: Update docs published pages
    # ubuntu on purpose: the script writes LF, which is what the file is stored with, so there is
    # nothing for autocrlf to normalise.
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: dev
      BRANCH_PREFIX: chore/docs-published-pages-update
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          # Full history: pushing a new branch from a shallow clone is rejected.
          fetch-depth: 0

      - name: Clean up temp branches from earlier runs
        shell: pwsh
        run: |
          # A prefixed branch with no open PR has been merged, closed, or orphaned.
          # Best effort - a failure here must not block today's update.
          $Branches = git ls-remote --heads origin |
            ForEach-Object { ($_ -split "`t")[1] -replace '^refs/heads/', '' } |
            Where-Object { $_ -like "$env:BRANCH_PREFIX-*" }

          foreach ($Branch in $Branches) {
            $OpenPrs = @(gh pr list --head $Branch --state open --json number | ConvertFrom-Json)
            if ($OpenPrs.Count -eq 0) {
              Write-Host "Deleting merged/closed branch $Branch"
              git push origin --delete $Branch
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not delete $Branch." }
            } else {
              Write-Host "Keeping $Branch (PR #$($OpenPrs[0].number) is still open)"
            }
          }
          exit 0

      - name: Update docs published pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Snapshot the current list so the PR body can say which pages changed.
          Copy-Item ./backend/Config/DocsPublishedPages.txt "$env:RUNNER_TEMP/DocsPublishedPages.before.txt"
          # No -AllowFallback: an unreachable or unparseable llms.txt should fail the run, not skip it.
          ./build/tools/Update-DocsPublishedPages.ps1

      - name: Stage changes
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- backend/Config/DocsPublishedPages.txt
          $Staged = @(git diff --cached --name-only)
          if ($Staged.Count -eq 0) {
            Write-Host 'Docs published pages are already up to date.'
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          Write-Host "Changed files:`n$($Staged -join "`n")"
          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the PR body
        if: steps.stage.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Slugs([string]$Path) {
            @(Get-Content -Path $Path | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          }
          $Before = Get-Slugs "$env:RUNNER_TEMP/DocsPublishedPages.before.txt"
          $After = Get-Slugs ./backend/Config/DocsPublishedPages.txt

          $Added = @($After | Where-Object { $_ -notin $Before } | Sort-Object)
          $Removed = @($Before | Where-Object { $_ -notin $After } | Sort-Object)

          function Format-SlugList {
            param($Slugs, $Heading)
            $Count = @($Slugs).Count
            if ($Count -eq 0) { return @() }
            $Lines = @('', "### $Heading ($Count)", '')
            $Lines += @($Slugs) | Select-Object -First 50 | ForEach-Object { '- [`{0}`](https://docs.cipp.app/{0})' -f $_ }
            if ($Count -gt 50) { $Lines += '- ...and {0} more' -f ($Count - 50) }
            return $Lines
          }

          $Body = @(
            'Automated refresh of the published docs page list, generated by `build/tools/Update-DocsPublishedPages.ps1` from [docs.cipp.app/llms.txt](https://docs.cipp.app/llms.txt).'
            ''
            'The SearchDocs / GetDoc MCP tools only link to pages in this list, and `Tests/Mcp/CippDocs.Tests.ps1` checks that every page in it maps back to a file under `docs/`. If Pester fails on this PR, a published URL no longer matches its repo path.'
            ''
            '**Pages:** {0:N0} -> {1:N0}' -f $Before.Count, $After.Count
          )
          $Body += Format-SlugList -Slugs $Added -Heading 'Newly published'
          $Body += Format-SlugList -Slugs $Removed -Heading 'No longer published'
          $Body += @(
            ''
            '---'
            ''
            '_Opened by the [Update Docs Published Pages]({0}/{1}/actions/runs/{2}) workflow. The `{3}-*` branch is deleted on the next run once this PR is merged or closed._' -f $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_RUN_ID, $env:BRANCH_PREFIX
          )
          $Body -join "`n" | Set-Content -Path "$env:RUNNER_TEMP/pr-body.md" -Encoding utf8

      - name: Commit, push and open the PR
        if: steps.stage.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # Reuse the branch of an already-open PR so a run of daily updates does not stack up one
          # PR per day; otherwise cut a fresh dated branch.
          $OpenPrs = @(gh pr list --state open --base $env:BASE_BRANCH --limit 100 --json number,headRefName | ConvertFrom-Json)
          $Existing = $OpenPrs | Where-Object { $_.headRefName -like "$env:BRANCH_PREFIX-*" } | Select-Object -First 1

          if ($Existing) {
            $Branch = $Existing.headRefName
            Write-Host "Updating PR #$($Existing.number) on $Branch"
          } else {
            $Branch = '{0}-{1}' -f $env:BRANCH_PREFIX, (Get-Date -Format 'yyyyMMdd')
            Write-Host "Creating $Branch"
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c $Branch
          git commit -m 'chore(docs): refresh published docs page snapshot'
          # Force: the branch is disposable and always one commit on top of dev.
          git push --force origin $Branch

          if (-not $Existing) {
            gh pr create `
              --base $env:BASE_BRANCH `
              --head $Branch `
              --title ('chore(docs): refresh published docs page snapshot ({0})' -f (Get-Date -Format 'yyyy-MM-dd')) `
              --body-file "$env:RUNNER_TEMP/pr-body.md"
          } else {
            gh pr edit $Existing.number --body-file "$env:RUNNER_TEMP/pr-body.md"
          }
