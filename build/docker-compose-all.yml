# macOS/Linux dev loop (frontend runs in a container too — see docker-compose-no-frontend.yml
# for the Windows loop, where node_modules over a bind mount is too slow).
#
# START WITH:
#   docker compose -p cipp -f docker-compose-all.yml up --pull always --watch
#
# The --watch flag is REQUIRED. The `develop: watch:` blocks below are what restart cipp-api on
# a backend source edit, and they are inert under a plain `up`/`up -d` — edit a .ps1, nothing
# happens. Windows gets this via Start-Cipp-Dev-Windows-docker.ps1, which runs `up --watch` in
# its own terminal; here it has to be on the command line. Watch runs in the foreground, so
# leave it in a dedicated terminal (Ctrl-C stops the stack).
#
# -p cipp keeps the project name stable regardless of the directory the command is run from.
#
# Ports: 5196 CRAFT (browse the app here), 3000 Next.js dev, 6006 Storybook, 10000-10002 azurite.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: cipp-azurite
    restart: unless-stopped
    # The prestart guard empties regenerable cache tables when the LokiJS file has
    # grown past the point where azurite can load it without OOM crash-looping.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "node /azurite-prestart.js /workspace &&
      exec azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /workspace
      --loose
      --skipApiVersionCheck
      --disableTelemetry"
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - NODE_OPTIONS=--max-old-space-size=8192
    volumes:
      - cipp-ng_azurite-data:/workspace
      - ./tools/azurite-prestart.js:/azurite-prestart.js:ro
    networks:
      - cipp-network

  cipp-manifests:
    # DEV ONLY seed step, runs to completion before cipp-api starts.
    #
    # Craft's DevExpandModuleExports (below) rewrites FunctionsToExport = '*' to the explicit
    # Public/*.ps1 list with a plain in-place write. Pointed at the bind-mounted source that
    # dirties backend/Modules/*.psd1 on every run. Instead, copy those manifests into the
    # gitignored .devmanifests/ and mount the copies over the source (see cipp-api volumes) —
    # the rewrite lands on the copy and the working tree stays clean. Production is unaffected:
    # the image build bakes explicit exports via ModuleBuilder and never runs this path.
    #
    # Copies are refreshed from source on every `up`, so genuine manifest edits (version bumps,
    # RequiredModules, ...) still flow through. The module list must match App__Worker__
    # DevExpandModules__N and the mount list in cipp-api.
    image: busybox:latest
    container_name: cipp-manifests
    command: >
      sh -c 'set -e; mkdir -p /out;
      for m in CIPPStandards CIPPAlerts CIPPTests CIPPDB CippExtensions CIPPActivityTriggers; do
      cp -f "/src/$$m/$$m.psd1" "/out/$$m.psd1"; done'
    volumes:
      - ../backend/Modules:/src:ro
      - ./.devmanifests:/out
    networks:
      - cipp-network

  cipp-api:
    # Dev loop: runs the plain CRAFT runtime image with the repo's backend/
    # bind-mounted over /app/API. The committed .psm1 stubs dot-source
    # Public/*.ps1, so PS source edits go live with a container restart —
    #
    # The frontend is NOT served from the image in this loop. CRAFT runs in
    # Development mode and proxies all non-API routes to the Next.js dev
    # server on the host (CRAFT_DEV_FRONTEND_URL).
    # then browse everything via http://localhost:5196 (same-origin API).
    image: ghcr.io/cyberdrain/craft:dev
    platform: linux/amd64
    container_name: cipp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5196:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CRAFT_VERBOSE=true
      - CRAFT_API_EGRESS_LIMIT_ENABLED=true
      - App__Setup__Enabled=false
      # Where the SearchDocs MCP tool finds the docs. Only needed in dev: the image puts them
      # at $CIPPRootPath/Docs, which Get-CippDocsRoot probes by default.
      - CIPPDocsPath=/app/Docs
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - NonLocalHostAzurite=true
      - CIPPNG=true
      - COMMIT_SHA=-unknown
      - App__Worker__HttpPoolSize=3
      - App__Worker__BgPoolSize=8
      - App__StatsHistory__SampleIntervalSeconds=10
      # DEV ONLY: this loop bind-mounts raw backend source whose module manifests declare
      # FunctionsToExport = '*'. PowerShell can't auto-load a wildcard-export module by command
      # name, so background dispatchers (e.g. CIPPDBCache) that probe with Get-Command fail with
      # "function not found" on workers that didn't eagerly import the module. This flag makes
      # Craft expand each wildcard manifest to its explicit Public/*.ps1 function list at startup
      # (idempotent — matches what the production ModuleBuilder build bakes in).
      - App__Worker__DevExpandModuleExports=true
      # Scope expansion to modules NOT eagerly imported into the worker pools (CIPPCore/
      # CIPPActivityTriggers/CIPPHTTP already are, so they don't need it). These are the ones
      # background dispatchers reach by command name and would otherwise fail to auto-load.
      - App__Worker__DevExpandModules__0=CIPPStandards
      - App__Worker__DevExpandModules__1=CIPPAlerts
      - App__Worker__DevExpandModules__2=CIPPTests
      - App__Worker__DevExpandModules__3=CIPPDB
      - App__Worker__DevExpandModules__4=CippExtensions
      - App__Worker__DevExpandModules__5=CIPPActivityTriggers
      # The Next.js dev server runs in a container, if using windows bind mounts are too slow for node_modules
      # you should use the other docker compose file without the frontend container and run the frontend dev server on the host using the start script
      - CRAFT_DEV_FRONTEND_URL=http://cipp-frontend:3000
      # DEV ONLY: Azure App Service injects REGION_NAME (normalised form, e.g. 'eastus').
      # Set it here so the region-derived timezone default can be exercised locally -
      # without it Initialize-CIPPTimezone correctly falls back to UTC. eastus -> America/New_York.
      #- REGION_NAME=eastus
    volumes:
      - ./config/appsettings.Local.Development.json:/app/appsettings.Development.json:ro
      # Optional Proxyman TLS trust. We proxy at the SYSTEM level, so Docker routes this
      # container's outbound HTTPS through Proxyman, which re-signs certs — the distroless
      # runtime must trust Proxyman's CA or all Graph/token calls fail. When build/.env sets
      # CIPP_API_CA_MOUNT (written by build/tools/Export-ProxymanCert.ps1) this mounts the
      # combined roots+Proxyman bundle OVER the image root store; unset, it is a /dev/null
      # no-op so contributors without Proxyman are unaffected. See docs in Export-ProxymanCert.ps1.
      - "${CIPP_API_CA_MOUNT:-/dev/null:/dev/null:ro}"
      # Live backend source. rw because runtime permission extraction writes
      # Config/function-permissions.json back into the repo (gitignored).
      - ../backend:/app/API
      # GitBook docs, indexed by the SearchDocs MCP tool. Without this the tool reports the
      # docs as missing, because only backend/ is bind-mounted and ../docs is not reachable
      # from inside the container.
      #
      # Mounted at /app/Docs and pointed at by CIPPDocsPath rather than at the image's own
      # /app/API/Docs: that path sits INSIDE the ../backend bind mount, and Docker creates a
      # nested mountpoint on the host to hang it off — leaving an empty backend/Docs in the
      # working tree that then shadows the real docs for Pester and anything else running
      # outside the container.
      - ../docs:/app/Docs:ro
      # Writable manifest shims, seeded by cipp-manifests. Each mount shadows a single
      # .psd1 so DevExpandModuleExports rewrites the copy under .devmanifests/ instead of
      # the tracked file in backend/Modules. Everything else in the module dir (Public/,
      # the .psm1 stub) still comes from the bind mount above, so PS edits stay live.
      - ./.devmanifests/CIPPStandards.psd1:/app/API/Modules/CIPPStandards/CIPPStandards.psd1
      - ./.devmanifests/CIPPAlerts.psd1:/app/API/Modules/CIPPAlerts/CIPPAlerts.psd1
      - ./.devmanifests/CIPPTests.psd1:/app/API/Modules/CIPPTests/CIPPTests.psd1
      - ./.devmanifests/CIPPDB.psd1:/app/API/Modules/CIPPDB/CIPPDB.psd1
      - ./.devmanifests/CippExtensions.psd1:/app/API/Modules/CippExtensions/CippExtensions.psd1
      - ./.devmanifests/CIPPActivityTriggers.psd1:/app/API/Modules/CIPPActivityTriggers/CIPPActivityTriggers.psd1
    develop:
      watch:
        - action: restart
          path: ../backend/Modules
          target: /app/API/Modules
        - action: restart
          path: ../backend/Shared
          target: /app/API/Shared
        - action: restart
          path: ../backend/Config
          target: /app/API/Config
          ignore:
            # container writes this back at startup, would cause a restart loop
            - function-permissions.json
    depends_on:
      azurite:
        condition: service_started
      # must finish first: without the seeded files Docker would create .devmanifests/*.psd1
      # as empty directories and every shadowed module would fail to import
      cipp-manifests:
        condition: service_completed_successfully
    networks:
      - cipp-network

  cipp-frontend:
    image: node:22-slim
    platform: linux/amd64
    container_name: cipp-frontend
    restart: unless-stopped
    working_dir: /app
    # npx next dev instead of `yarn run dev`: the repo's dev script binds 127.0.0.1,
    # which is unreachable from the cipp-api container's proxy — bind 0.0.0.0 here.
    command: sh -c "yarn install --network-timeout 500000 && npx next dev -H 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # Watch for file changes so the dev server reloads when frontend source files change
      # Optional Proxyman TLS trust for yarn/npm fetches. The system proxy re-signs the
      # registry's cert, so a fresh `yarn install` fails with SELF_SIGNED_CERT_IN_CHAIN
      # unless Node trusts Proxyman's CA. build/.env sets CIPP_NODE_CA to the mounted
      # bundle path when enabled; empty (default) is a no-op Node ignores silently.
      - NODE_EXTRA_CA_CERTS=${CIPP_NODE_CA:-}
    volumes:
      - ../frontend:/app
      - cipp-frontend_node_modules:/app/node_modules
      - cipp-frontend_out_dev:/app/out/dev
      # Paired with NODE_EXTRA_CA_CERTS above; /dev/null no-op when CIPP_NODE_CA_MOUNT is unset.
      - "${CIPP_NODE_CA_MOUNT:-/dev/null:/dev/null:ro}"
    # cipp-storybook shares this container's node_modules volume and must not run its own
    # `yarn install` against it. A TCP connect to the dev server is the signal that install
    # finished AND next dev is listening — cheap, and it doesn't wait on a route compile the
    # way an HTTP request to / would.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      - azurite
    networks:
      - cipp-network

  cipp-storybook:
    # Storybook dev server on http://localhost:6006, driven by frontend/.storybook.
    #
    # Deliberately NOT in docker-compose-no-frontend.yml: it reuses cipp-frontend's
    # node_modules volume, and on the Windows loop that volume doesn't exist (run
    # `yarn storybook` on the host there instead).
    image: node:22-slim
    platform: linux/amd64
    container_name: cipp-storybook
    restart: unless-stopped
    working_dir: /app
    # No yarn install here — cipp-frontend owns that for the shared node_modules volume, and
    # depends_on/service_healthy below guarantees it has finished. --host 0.0.0.0 for the same
    # reason as next dev: the default bind is unreachable from outside the container.
    #
    # The playwright install is for @storybook/addon-vitest, which boots vitest in browser mode
    # inside the dev server — without a browser it throws "Executable doesn't exist" and the
    # component-test widget is dead. npx resolves the version pinned in package.json, so this
    # stays correct across playwright bumps. Browsers land in the cached volume below (first run
    # only); --with-deps installs the apt libs into the container fs, so it re-runs on recreate.
    command: >
      sh -c "npx playwright install --with-deps chromium &&
      npx storybook dev -p 6006 --host 0.0.0.0 --no-open"
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      - CHOKIDAR_USEPOLLING=true # story/source edits trigger a rebuild over the bind mount
      - NODE_OPTIONS=--max-old-space-size=4096
      # Optional Proxyman TLS trust (playwright/npx fetches); see cipp-frontend above.
      - NODE_EXTRA_CA_CERTS=${CIPP_NODE_CA:-}
    volumes:
      - ../frontend:/app
      - cipp-frontend_node_modules:/app/node_modules
      - cipp-storybook_playwright:/root/.cache/ms-playwright
      - "${CIPP_NODE_CA_MOUNT:-/dev/null:/dev/null:ro}"
    depends_on:
      cipp-frontend:
        condition: service_healthy
    networks:
      - cipp-network

volumes:
  cipp-ng_azurite-data:
    external: true
  cipp-frontend_node_modules:
    external: true
  cipp-frontend_out_dev:
    external: true
  # not external: compose creates this one, it's a throwaway browser cache
  cipp-storybook_playwright:

networks:
  cipp-network:
    driver: bridge
