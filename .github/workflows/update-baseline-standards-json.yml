name: Update Baseline Standards JSON

# Rebuilds backend/Config/baselineStandards.json (the combined baseline catalog standards.cipp.app
# reads) from backend/Config/BaselineStandards with build/tools/Update-BaselineStandardsJson.ps1,
# and opens a PR against dev when it changed. baseline_standards_json.yml fails a PR that leaves it
# stale; this catches anything that landed without regenerating it. Requires "Allow GitHub Actions
# to create and approve pull requests" in the repository's Actions settings.

on:
  schedule:
    - cron: '30 4 * * *' # Daily 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-baseline-standards-json
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'CyberDrain/CIPP'
    name: Update baseline standards JSON
    # ubuntu on purpose: the script writes LF, which is what the file is stored with.
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: dev
      BRANCH_PREFIX: chore/baseline-standards-json-update
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          # Full history: pushing a new branch from a shallow clone is rejected.
          fetch-depth: 0

      - name: Clean up temp branches from earlier runs
        shell: pwsh
        run: |
          # A prefixed branch with no open PR has been merged, closed, or orphaned.
          # Best effort - a failure here must not block today's update.
          $Branches = git ls-remote --heads origin |
            ForEach-Object { ($_ -split "`t")[1] -replace '^refs/heads/', '' } |
            Where-Object { $_ -like "$env:BRANCH_PREFIX-*" }

          foreach ($Branch in $Branches) {
            $OpenPrs = @(gh pr list --head $Branch --state open --json number | ConvertFrom-Json)
            if ($OpenPrs.Count -eq 0) {
              Write-Host "Deleting merged/closed branch $Branch"
              git push origin --delete $Branch
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not delete $Branch." }
            } else {
              Write-Host "Keeping $Branch (PR #$($OpenPrs[0].number) is still open)"
            }
          }
          exit 0

      - name: Regenerate baseline standards JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Snapshot the current file so the PR body can say which baselines changed.
          $Before = './backend/Config/baselineStandards.json'
          if (Test-Path $Before) { Copy-Item $Before "$env:RUNNER_TEMP/baselineStandards.before.json" }
          ./build/tools/Update-BaselineStandardsJson.ps1

      - name: Stage changes
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- backend/Config/baselineStandards.json
          $Staged = @(git diff --cached --name-only)
          if ($Staged.Count -eq 0) {
            Write-Host 'Baseline standards JSON is already up to date.'
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the PR body
        if: steps.stage.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Baselines([string]$Path) {
            $Map = @{}
            if (Test-Path $Path) {
              foreach ($Item in (Get-Content -Path $Path -Raw | ConvertFrom-Json)) {
                if ($Item.name) { $Map[$Item.name] = $Item | ConvertTo-Json -Depth 100 -Compress }
              }
            }
            $Map
          }
          $Before = Get-Baselines "$env:RUNNER_TEMP/baselineStandards.before.json"
          $After = Get-Baselines ./backend/Config/baselineStandards.json

          $Added = @($After.Keys | Where-Object { -not $Before.ContainsKey($_) } | Sort-Object)
          $Removed = @($Before.Keys | Where-Object { -not $After.ContainsKey($_) } | Sort-Object)
          $Changed = @($After.Keys | Where-Object { $Before.ContainsKey($_) -and $Before[$_] -cne $After[$_] } | Sort-Object)

          function Format-NameList {
            param($Names, $Heading)
            $Count = @($Names).Count
            if ($Count -eq 0) { return @() }
            $Lines = @('', "### $Heading ($Count)", '')
            $Lines += @($Names) | Select-Object -First 50 | ForEach-Object { '- `{0}`' -f $_ }
            if ($Count -gt 50) { $Lines += '- ...and {0} more' -f ($Count - 50) }
            return $Lines
          }

          $Body = @(
            'Automated rebuild of `backend/Config/baselineStandards.json`, generated by `build/tools/Update-BaselineStandardsJson.ps1` from `backend/Config/BaselineStandards`. standards.cipp.app reads this file to list the baselines.'
            ''
            '**Baselines:** {0:N0} -> {1:N0}' -f $Before.Count, $After.Count
          )
          $Body += Format-NameList -Names $Added -Heading 'Added'
          $Body += Format-NameList -Names $Removed -Heading 'Removed'
          $Body += Format-NameList -Names $Changed -Heading 'Changed'
          $Body += @(
            ''
            '---'
            ''
            '_Opened by the [Update Baseline Standards JSON]({0}/{1}/actions/runs/{2}) workflow. The `{3}-*` branch is deleted on the next run once this PR is merged or closed._' -f $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_RUN_ID, $env:BRANCH_PREFIX
          )
          $Body -join "`n" | Set-Content -Path "$env:RUNNER_TEMP/pr-body.md" -Encoding utf8

      - name: Commit, push and open the PR
        if: steps.stage.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # Reuse the branch of an already-open PR so a run of daily updates does not stack up one
          # PR per day; otherwise cut a fresh dated branch.
          $OpenPrs = @(gh pr list --state open --base $env:BASE_BRANCH --limit 100 --json number,headRefName | ConvertFrom-Json)
          $Existing = $OpenPrs | Where-Object { $_.headRefName -like "$env:BRANCH_PREFIX-*" } | Select-Object -First 1

          if ($Existing) {
            $Branch = $Existing.headRefName
            Write-Host "Updating PR #$($Existing.number) on $Branch"
          } else {
            $Branch = '{0}-{1}' -f $env:BRANCH_PREFIX, (Get-Date -Format 'yyyyMMdd')
            Write-Host "Creating $Branch"
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c $Branch
          git commit -m 'chore(baselines): regenerate combined baseline standards JSON'
          # Force: the branch is disposable and always one commit on top of dev.
          git push --force origin $Branch

          if (-not $Existing) {
            gh pr create `
              --base $env:BASE_BRANCH `
              --head $Branch `
              --title ('chore(baselines): regenerate combined baseline standards JSON ({0})' -f (Get-Date -Format 'yyyy-MM-dd')) `
              --body-file "$env:RUNNER_TEMP/pr-body.md"
          } else {
            gh pr edit $Existing.number --body-file "$env:RUNNER_TEMP/pr-body.md"
          }
